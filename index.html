<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valor Boom Management LLC | Premium Lawn Care in Jupiter, FL</title>
    <meta name="description" content="Professional lawn care and landscape management serving Jupiter, FL and surrounding areas. Lawn mowing, hedge trimming, leaf cleanup, irrigation, mulching, and fertilization. Free quotes." />
    <meta property="og:image" content="/valor-boom/assets/images/app_logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/valor-boom/assets/images/app_logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Decodes the path public/404.html encoded before redirecting here,
      // restoring the real URL so React Router mounts on the right route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
