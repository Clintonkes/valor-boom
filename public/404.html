<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Valor Boom Management LLC</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct link or a
      // refresh on a client-routed path (e.g. /about) 404s here instead of
      // reaching index.html. Encode the real path into a query string and
      // redirect to the app root, where the inline script in index.html
      // decodes it back before React Router mounts.
      // See https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0; // served from the valorboom.com root
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
